<p-dialog [(visible)]="displayDialog" [header]="'auth.emailRequiredTitle' | translate" [modal]="true" [closable]="false"
    [closeOnEscape]="false" [style]="{width: '500px'}">

    <div class="flex flex-col gap-4 p-2">
        <p class="text-surface-700 dark:text-surface-200">{{ 'auth.emailRequiredMessage' | translate }}</p>
        <div class="flex flex-col gap-2">
            <label for="email" class="block font-medium mb-3">{{ 'auth.email' | translate }} *</label>
            <input pInputText id="email" [(ngModel)]="email" class="w-full" [placeholder]="'auth.email' | translate"
                type="email" (keyup.enter)="saveEmail()" />
        </div>
    </div>

    <ng-template #footer>
        <p-button [label]="'common.save' | translate" icon="pi pi-check" (onClick)="saveEmail()" [loading]="isLoading">
        </p-button>
    </ng-template>
</p-dialog>
<p-toast></p-toast>
