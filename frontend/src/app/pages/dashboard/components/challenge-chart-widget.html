<p-card class="h-full w-full">
    <ng-template #subtitle>
        <span translate>dashboard.charts.challengeTypes</span>
    </ng-template>
    @if(loading) {
    <div class="text-center py-5">
        <i class="pi pi-spin pi-spinner text-4xl text-muted-color"></i>
    </div>
    } @else {
    <div class="h-full w-full">
        <p-chart type="pie" [data]="chartData" [options]="chartOptions" width="100%" height="100%" />
    </div>
    }
</p-card>
