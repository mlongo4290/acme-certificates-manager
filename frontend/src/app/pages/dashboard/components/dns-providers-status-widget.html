<p-card class="col-span-12 lg:col-span-6 xl:col-span-3">
    <ng-template #subtitle>
        <span translate>dashboard.dnsProviders.title</span>
    </ng-template>

    @if(loading) {
    <div class="text-center py-5">
        <i class="pi pi-spin pi-spinner text-4xl text-muted-color"></i>
    </div>
    }
    @else {
    <div class="flex justify-between mb-1">
        <div translate>dashboard.dnsProviders.total</div>
        <div>{{ totalProviders }}</div>
    </div>
    <div class="flex justify-between mb-1">
        <span translate>dashboard.dnsProviders.active</span>
        <span class="text-green-500">{{ activeProviders }}</span>
    </div>
    <div class="flex justify-between mb-1">
        <span translate>dashboard.dnsProviders.disabled</span>
        <span class="text-orange-500">{{ disabledProviders }}</span>
    </div>
    }
</p-card>
