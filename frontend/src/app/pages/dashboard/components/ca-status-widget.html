<p-card class="h-full w-full">
    <ng-template #subtitle>
        <span translate>dashboard.certificateAuthorities.title</span>
    </ng-template>

    @if(loading) {
    <div class="text-center py-5">
        <i class="pi pi-spin pi-spinner text-4xl text-muted-color"></i>
    </div>
    }
    @else {
    <div class="flex justify-between items-center mb-2">
        <span translate>dashboard.certificateAuthorities.total</span>
        <span class="font-semibold">{{ totalCAs }}</span>
    </div>
    <div class="flex justify-between items-center mb-2">
        <span translate>dashboard.certificateAuthorities.default</span>
        <span class="font-semibold">{{ defaultCA }}</span>
    </div>
    <div class="flex justify-between items-center mb-2">
        <span translate>dashboard.certificateAuthorities.accounts</span>
        <span class="font-semibold">{{ acmeAccountsCount }}</span>
    </div>
    }
</p-card>
