<p-card class="h-full w-full">
    <ng-template #subtitle>
        <div class="flex justify-between items-center">
            <span translate>dashboard.recentJobs.title</span>
            <a routerLink="/jobs" class="text-xs text-primary cursor-pointer hover:underline" translate>dashboard.recentJobs.viewAll</a>
        </div>
    </ng-template>

    @if(loading) {
    <div class="text-center py-5">
        <i class="pi pi-spin pi-spinner text-4xl text-muted-color"></i>
    </div>
    } @else if(jobs.length === 0) {
    <div class="text-center py-5 text-muted-color">
        <i class="pi pi-inbox text-2xl mb-2 block"></i>
        <span class="text-sm" translate>dashboard.recentJobs.empty</span>
    </div>
    } @else {
    <div class="flex flex-col gap-2">
        @for(job of jobs; track job._id) {
        <div class="flex items-center gap-3 py-1">
            <i [class]="getStatusIcon(job.status) + ' shrink-0 text-sm'"></i>
            <div class="flex-1 min-w-0">
                <div class="text-sm font-medium truncate">{{ job.certDomain }}</div>
                <div class="text-xs text-muted-color">{{ 'jobs.type.' + job.type | translate }}</div>
            </div>
            <div class="text-xs text-muted-color shrink-0">{{ timeAgo(job.startedAt) }}</div>
        </div>
        }
    </div>
    }
</p-card>
